name: Release

# Tag vX.Y.Z (matching plugins/ynot/.claude-plugin/plugin.json) to publish the skill zip.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches the plugin version
        run: |
          want="v$(jq -r .version plugins/ynot/.claude-plugin/plugin.json)"
          [ "$want" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != plugin version $want"; exit 1; }
      - name: Build the release zips
        run: ./scripts/package-skill.sh
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/ynotone-plugin.zip dist/ynot-reporting.zip \
            --title "$GITHUB_REF_NAME" --notes "ynotone-plugin.zip: the whole plugin, to upload under Organization settings → Plugins & skills. ynot-reporting.zip: the skill alone, for Customize → Skills. Most people install from the marketplace instead: see the README."
